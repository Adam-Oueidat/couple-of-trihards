name: Deploy

on:
  push:
    branches: [main]
  # Allow re-deploying the current main without an empty commit.
  workflow_dispatch:

# Never let two deploys race to the same tag.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: trilog

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # federate into AWS via OIDC; no long-lived keys stored
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          # App Runner is x86_64 only; be explicit so this stays correct if the
          # runner architecture ever changes.
          docker build --platform linux/amd64 \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          # Push the immutable tag first: if the run dies midway, :latest still
          # points at the previous good image rather than a partial release.
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "Deployed image: $IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
